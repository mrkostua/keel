name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Lint, test, build (Android + Desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Lint
        run: ./gradlew spotlessCheck
      - name: Test
        run: ./gradlew :shared:desktopTest :shared:testAndroidHostTest
      - name: Build
        run: ./gradlew :androidApp:assembleDebug :desktopApp:classes

  ios-build:
    name: Compile iOS framework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Link iOS simulator framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
